name: Exported Web game smoke

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Run containing an already exported Web game artifact
        required: true
        type: string
      artifact_name:
        description: Exact artifact name in that run
        required: true
        type: string
      build_evidence_artifact:
        description: Optional build-evidence artifact from the same successful source run
        required: false
        default: ''
        type: string
      expected_commit:
        description: Full expected source commit (required with build evidence)
        required: false
        default: ''
        type: string
      entry:
        description: HTML entry relative to the artifact root
        required: true
        default: index.html
        type: string
      script_marker:
        description: Success marker emitted by the exported game's C# code
        required: true
        default: FUNKE_EXPORT_SMOKE_SCRIPT_OK
        type: string
      expected_pixel:
        description: Expected normalized x,y,R,G,B on the game canvas
        required: true
        default: 0.5,0.5,255,0,255
        type: string

permissions:
  contents: read
  actions: read

jobs:
  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install browser test dependencies
        run: |
          python -m pip install Pillow
          npm install --prefix "$RUNNER_TEMP/funke-browser" playwright@1.62.1
          "$RUNNER_TEMP/funke-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Verify build evidence source
        shell: python
        env:
          SOURCE_RUN: ${{ inputs.source_run_id }}
          EVIDENCE_ARTIFACT: ${{ inputs.build_evidence_artifact }}
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          GH_TOKEN: ${{ github.token }}
        run: |
          import json, os, re, sys, urllib.request
          sys.path.insert(0, "scripts/ci")
          from build_export_evidence import validate_source_run
          artifact, commit = os.environ["EVIDENCE_ARTIFACT"], os.environ["EXPECTED_COMMIT"]
          if bool(artifact) != bool(commit):
              raise SystemExit("Build evidence artifact and expected commit must be supplied together.")
          if artifact:
              run_id = os.environ["SOURCE_RUN"]
              if not run_id.isdecimal() or not re.fullmatch(r"[0-9a-f]{40}", commit):
                  raise SystemExit("Invalid source run ID or full commit hash.")
              repository = os.environ["GITHUB_REPOSITORY"]
              request = urllib.request.Request(
                  f"{os.environ['GITHUB_API_URL']}/repos/{repository}/actions/runs/{run_id}",
                  headers={"Authorization": "Bearer " + os.environ["GH_TOKEN"],
                           "Accept": "application/vnd.github+json"})
              with urllib.request.urlopen(request, timeout=30) as response:
                  validate_source_run(json.load(response), repository, commit)
      - name: Download build evidence
        if: inputs.build_evidence_artifact != ''
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.source_run_id }}
          name: ${{ inputs.build_evidence_artifact }}
          path: ${{ runner.temp }}/funke-build-evidence
      - name: Download exported game
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.source_run_id }}
          name: ${{ inputs.artifact_name }}
          path: ${{ runner.temp }}/funke-export
      - name: Run the actual WebAssembly export
        shell: python
        env:
          EVIDENCE_ARTIFACT: ${{ inputs.build_evidence_artifact }}
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          WEB_ENTRY: ${{ inputs.entry }}
          SCRIPT_MARKER: ${{ inputs.script_marker }}
          EXPECTED_PIXEL: ${{ inputs.expected_pixel }}
        run: |
          import os
          import subprocess
          import sys
          from pathlib import Path

          temporary = Path(os.environ["RUNNER_TEMP"])
          root = (temporary / "funke-export").resolve()
          entry = (root / os.environ["WEB_ENTRY"]).resolve()
          if not entry.is_relative_to(root) or not entry.is_file():
              raise SystemExit("The entry must be an existing file inside the downloaded artifact.")
          os.environ["NODE_PATH"] = str(temporary / "funke-browser/node_modules")
          provenance = (["--build-evidence", str(temporary / "funke-build-evidence/build-evidence.json"),
                         "--expected-commit", os.environ["EXPECTED_COMMIT"]]
                        if os.environ["EVIDENCE_ARTIFACT"] else [])
          subprocess.run([
              sys.executable, "scripts/ci/platform_export_smoke.py",
              "--output", "output/platform-web-smoke",
              "--expect-log", os.environ["SCRIPT_MARKER"],
              "--expect-pixel", os.environ["EXPECTED_PIXEL"],
          ] + provenance + [
              "web", "--entry", str(entry),
              "--browser-arg=--enable-unsafe-webgpu",
              "--browser-arg=--use-angle=swiftshader",
          ], check=True)
      - name: Preserve verdict, console and rendered image
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Web-export-smoke-evidence
          path: output/platform-web-smoke
          if-no-files-found: warn
      - name: Summarize runtime evidence and remaining qualification
        if: always()
        shell: python
        run: |
          import json
          import os
          from pathlib import Path

          path = Path("output/platform-web-smoke/result.json")
          result = json.loads(path.read_text()) if path.is_file() else {}
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("## Platform evidence\n\n| Level | Status |\n|---|---|\n")
              for level in ("unit_mock", "real_build", "real_runtime", "physical_device"):
                  status = result.get("evidenceLevels", {}).get(level, {}).get("status", "unverified")
                  summary.write(f"| {level} | {status} |\n")
              summary.write("\nBuild provenance is verified only when supplied from a trusted source run. "
                            "Platform qualification remains **unverified**.\n")
