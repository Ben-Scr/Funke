name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      platforms:
        description: Platforms to validate
        type: choice
        options: [all, posix, linux, macos]
        default: all
      linux_core_only:
        description: Only rerun Linux core validation
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && inputs.platforms || 'all' }}-${{ inputs.linux_core_only && 'core' || 'full' }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  script-tests:
    if: ${{ !inputs.linux_core_only }}
    name: Script tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.platforms == 'linux' && '["ubuntu-24.04"]' || inputs.platforms == 'macos' && '["macos-15"]' || inputs.platforms == 'posix' && '["ubuntu-24.04","macos-15"]' || '["windows-2022","ubuntu-24.04","macos-15"]') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Setup .NET for PackageTool integration tests
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Release, platform builder, packaging and Web preview tests
        id: scripts
        run: python scripts/ci/run_script_tests.py --output test-results/python.json


      - name: Record per-lane CI evidence
        if: always()
        env:
          STEPS_JSON: ${{ toJSON(steps) }}
          CORE_ONLY: ${{ inputs.linux_core_only || false }}
        run: python scripts/ci/check_ci_evidence.py --capture-lane "script-tests/${{ matrix.os }}" --results test-results/python.json --output ci-evidence/lane.json

      - name: Upload per-lane CI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Funke-CI-Lane-script-tests-${{ matrix.os }}
          path: |
            ci-evidence/lane.json
            test-results/python.json
          if-no-files-found: error

  managed-tests:
    if: ${{ !inputs.linux_core_only }}
    name: C# tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.platforms == 'linux' && '["ubuntu-24.04"]' || inputs.platforms == 'macos' && '["macos-15"]' || inputs.platforms == 'posix' && '["ubuntu-24.04","macos-15"]' || '["windows-2022","ubuntu-24.04","macos-15"]') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      # These tests use managed binding stubs and need no native engine or GPU.
      # Override only PlatformTarget so ARM64 macOS can run them while retaining
      # ScriptCore's Release|x64 configuration properties.
      - name: C# ScriptCore Tests
        id: managed
        run: dotnet test Tests/Funke-ScriptCore-Tests/Funke-ScriptCore-Tests.csproj -c Release -p:PlatformTarget=AnyCPU --nologo --logger trx --results-directory test-results

      - name: Upload C# Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Funke-CSharp-Tests-${{ matrix.os }}
          path: test-results/*.trx
          if-no-files-found: warn


      - name: Record per-lane CI evidence
        if: always()
        env:
          STEPS_JSON: ${{ toJSON(steps) }}
          CORE_ONLY: ${{ inputs.linux_core_only || false }}
        run: python scripts/ci/check_ci_evidence.py --capture-lane "managed-tests/${{ matrix.os }}" --results test-results --output ci-evidence/lane.json

      - name: Upload per-lane CI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Funke-CI-Lane-managed-tests-${{ matrix.os }}
          path: ci-evidence/lane.json
          if-no-files-found: error

  windows-build:
    if: ${{ !inputs.linux_core_only && (github.event_name != 'workflow_dispatch' || inputs.platforms == 'all') }}
    needs: script-tests
    runs-on: windows-2022
    outputs:
      version: ${{ steps.build_metadata.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Generate and Validate Build Identity
        id: build_metadata
        shell: pwsh
        run: |
          $arguments = @('--require-clean', '--github-output', $env:GITHUB_OUTPUT)
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $arguments += @('--tag', $env:GITHUB_REF_NAME)
          }
          python scripts/generate_build_metadata.py @arguments

      - name: Validate Tag Signing Configuration
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          FUNKE_SIGNING_CERTIFICATE_BASE64: ${{ secrets.FUNKE_SIGNING_CERTIFICATE_BASE64 }}
          FUNKE_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.FUNKE_SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:FUNKE_SIGNING_CERTIFICATE_BASE64)) {
            throw 'Tagged releases require the FUNKE_SIGNING_CERTIFICATE_BASE64 secret.'
          }
          if ([string]::IsNullOrWhiteSpace($env:FUNKE_SIGNING_CERTIFICATE_PASSWORD)) {
            throw 'Tagged releases require the FUNKE_SIGNING_CERTIFICATE_PASSWORD secret.'
          }
          try {
            [Convert]::FromBase64String($env:FUNKE_SIGNING_CERTIFICATE_BASE64) | Out-Null
          }
          catch {
            throw 'FUNKE_SIGNING_CERTIFICATE_BASE64 is not valid base64.'
          }

      - name: Verify Vendor Patch Inputs
        shell: pwsh
        run: python scripts/vendor_patches.py verify

      # WebGPU/Dawn is the engine's only graphics backend. External/dawn/ is
      # git-ignored and built out-of-band by scripts/dawn/SetupDawn.bat, so CI
      # has to produce webgpu_dawn.lib + the webgpu/ headers itself or the ImGui
      # backend fails with `C1083: webgpu/webgpu.h` and the engine fails to link.
      # The build is ~30-60 min, so cache it keyed on the pinned Dawn revision
      # (scripts/dawn/dawn-revision.txt) + the build scripts. Restore/build/save
      # is split so a cache-miss build is saved even if a later step fails.
      - name: Restore Dawn cache
        id: cache-dawn
        uses: actions/cache/restore@v4
        with:
          path: |
            External/dawn/include
            External/dawn/build/gen/include
            External/dawn/build/src/dawn/native/Debug/webgpu_dawn.lib
            External/dawn/build/src/dawn/native/Release/webgpu_dawn.lib
            External/dawn/LICENSE
            External/dawn/funke-artifacts.json
            External/dawn/third_party/**/LICENSE*
            External/dawn/third_party/**/NOTICE*
            External/dawn/third_party/**/COPYING*
            External/dawn/third_party/**/ThirdPartyNotices.txt
          key: dawn-v5-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/dawn/*.txt', 'scripts/dawn/*.py', 'scripts/dawn/*.sh', 'scripts/dawn/*.bat', 'scripts/dawn/*.ps1', 'scripts/dawn/patches/**') }}

      - name: Validate Dawn artifacts
        id: validate-dawn
        run: python scripts/dawn/ValidateDawnCache.py --ci

      - name: Build Dawn (missing or invalid artifacts)
        if: steps.validate-dawn.outputs.valid != 'true'
        shell: cmd
        env:
          DAWN_BUILD_CONFIGS: Debug Release
          DAWN_SKIP_PREMAKE: "1"
        run: scripts\dawn\SetupDawn.bat

      - name: Save Dawn cache
        if: steps.cache-dawn.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            External/dawn/include
            External/dawn/build/gen/include
            External/dawn/build/src/dawn/native/Debug/webgpu_dawn.lib
            External/dawn/build/src/dawn/native/Release/webgpu_dawn.lib
            External/dawn/LICENSE
            External/dawn/funke-artifacts.json
            External/dawn/third_party/**/LICENSE*
            External/dawn/third_party/**/NOTICE*
            External/dawn/third_party/**/COPYING*
            External/dawn/third_party/**/ThirdPartyNotices.txt
          key: ${{ steps.cache-dawn.outputs.cache-primary-key }}

      - name: Generate Project Files
        shell: pwsh
        run: python scripts/Setup.py

      - name: Verify Vendor Patches Applied
        shell: pwsh
        run: python scripts/vendor_patches.py verify --require-applied

      - name: Windows Engine + Editor Tests
        id: native_release
        shell: pwsh
        run: scripts/RunTests.bat --release

      - name: Windows Debug Engine + Editor Tests
        id: native_debug
        shell: pwsh
        run: scripts/RunTests.bat

      - name: Capture bounded CPU performance trend
        shell: pwsh
        run: |
          python scripts/benchmarks/performance/CaptureBuild.py --output artifacts/performance/ci-build `
            --binary bin/Release-windows-x86_64/Funke-Engine-Tests/Funke-Engine-Tests.exe `
            --binary bin/Release-windows-x86_64/Funke-Engine-Tests/Funke-Engine.dll `
            -- pwsh -NoProfile -File scripts/dev/Build.ps1 EngineTests -Config Release -NoRegenCheck
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/benchmarks/performance/Run.py --output artifacts/performance/ci-transform `
            --build-manifest artifacts/performance/ci-build/build.json --case-prefix transform-flat- `
            --samples 30 --repeats 3 --warmups 5 --timeout 30 `
            --conditions "Shared GitHub Windows runner; trend only, no calibrated timing gate"

      - name: Preserve CPU performance trend and provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Funke-Performance-Windows-${{ github.sha }}
          path: artifacts/performance
          if-no-files-found: error

      - name: Project-local Package Smoke Test
        shell: pwsh
        run: scripts/ci/project_package_smoke_test.ps1 -Configuration Release

      - name: Windows Core-only Engine Validation
        shell: pwsh
        run: scripts/ci/core_module_build.ps1

      - name: Nine physics module builds and runtime probes
        shell: pwsh
        run: python scripts/ci/physics_module_matrix.py --build

      - name: Preserve physics module evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Funke-Physics-Modules-Windows
          path: bin-int/_agent/physics-module-matrix
          if-no-files-found: error

      - name: Build Release + Dist Publish Bundle and Windows Installer
        shell: pwsh
        env:
          FUNKE_SIGNING_CERTIFICATE_BASE64: ${{ secrets.FUNKE_SIGNING_CERTIFICATE_BASE64 }}
          FUNKE_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.FUNKE_SIGNING_CERTIFICATE_PASSWORD }}
          FUNKE_SIGNING_TIMESTAMP_URL: ${{ vars.FUNKE_SIGNING_TIMESTAMP_URL }}
        run: |
          $certificatePath = $null
          try {
            $arguments = @{ PublishBundle = $true }
            if ($env:GITHUB_REF_TYPE -eq 'tag') {
              $arguments.ReleaseTag = $env:GITHUB_REF_NAME
              $arguments.RequireSigning = $true
            }
            if ($env:FUNKE_SIGNING_CERTIFICATE_BASE64) {
              $certificatePath = Join-Path $env:RUNNER_TEMP 'funke-code-signing.pfx'
              [IO.File]::WriteAllBytes(
                $certificatePath,
                [Convert]::FromBase64String($env:FUNKE_SIGNING_CERTIFICATE_BASE64)
              )
              $arguments.SigningCertificatePath = $certificatePath
              if ($env:FUNKE_SIGNING_TIMESTAMP_URL) {
                $arguments.SigningTimestampUrl = $env:FUNKE_SIGNING_TIMESTAMP_URL
              }
            }
            .\scripts\BuildWindows.ps1 @arguments
            if ($LASTEXITCODE -ne 0) { throw 'Windows bundle build failed.' }
            $installerArguments = @{ DownloadCompiler = $true }
            if ($env:GITHUB_REF_TYPE -eq 'tag') {
              $installerArguments.RequireSigning = $true
            }
            if ($certificatePath) {
              $installerArguments.SigningCertificatePath = $certificatePath
              if ($env:FUNKE_SIGNING_TIMESTAMP_URL) {
                $installerArguments.SigningTimestampUrl = $env:FUNKE_SIGNING_TIMESTAMP_URL
              }
            }
            .\scripts\BuildInstaller.ps1 @installerArguments
            if ($LASTEXITCODE -ne 0) { throw 'Windows installer build failed.' }
          }
          finally {
            if ($certificatePath -and (Test-Path -LiteralPath $certificatePath)) {
              Remove-Item -LiteralPath $certificatePath -Force
            }
          }

      - name: Bundled SDK Package Authoring Smoke Test
        shell: pwsh
        run: scripts/ci/project_package_smoke_test.ps1 -Configuration Release -EngineRoot bin/Release-windows-x86_64/Funke-Launcher/EngineSDK

      - name: Bundled SDK Dist Package Authoring Smoke Test
        shell: pwsh
        run: scripts/ci/project_package_smoke_test.ps1 -Configuration Dist -EngineRoot bin/Release-windows-x86_64/Funke-Launcher/EngineSDK

      - name: Native Scripting Convenience SDK Test
        shell: pwsh
        run: python scripts/ci/native_scripting_test.py --sdk bin/Release-windows-x86_64/Funke-Launcher/EngineSDK --test-exe bin/Release-windows-x86_64/Funke-Editor-Tests/Funke-Editor-Tests.exe --output bin-int/native-scripting-ci

      - name: Windows Runtime Smoke Test
        id: runtime
        shell: pwsh
        run: python scripts/ci/runtime_smoke_test.py --binary bin/Release-windows-x86_64/Funke-Runtime/Funke-Runtime.exe

      - name: Windows Export With Bundled .NET
        run: python scripts/ci/desktop_export_smoke_test.py --cli bin/Release-windows-x86_64/Funke-CLI/funke.exe

      - name: Packaged Launcher + Editor Smoke Tests
        id: installed_apps
        shell: pwsh
        run: |
          $bundle = 'bin/Release-windows-x86_64/Funke-Launcher'
          python scripts/ci/application_smoke_test.py --binary "$bundle/Funke-Launcher.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/ci/application_smoke_test.py --binary "$bundle/Funke-Editor.exe" --editor-project
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Archived Launcher + Editor + Dist Runtime Smoke Tests
        id: archived_apps
        shell: pwsh
        run: |
          $stageLeaf = 'Funke Dist Pr{0}fung' -f [char]0x00FC
          $stage = Join-Path $env:RUNNER_TEMP $stageLeaf
          if (Test-Path -LiteralPath $stage) {
            Remove-Item -LiteralPath $stage -Recurse -Force
          }
          $archive = Join-Path 'bin/Release-windows-x86_64' '${{ steps.build_metadata.outputs.archive_name }}'
          Expand-Archive -LiteralPath $archive -DestinationPath $stage
          $launcher = Join-Path $stage 'Funke-Launcher.exe'
          $editor = Join-Path $stage 'Funke-Editor.exe'
          python scripts/ci/application_smoke_test.py --binary $launcher
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/ci/application_smoke_test.py --binary $editor --editor-project
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $runtime = Join-Path $stage 'EngineSDK/Runtime-Dist/Funke-Runtime.exe'
          python scripts/ci/runtime_smoke_test.py --binary $runtime --require-scripting
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify Release Checksum and Signature
        shell: pwsh
        run: |
          $archive = Join-Path 'bin/Release-windows-x86_64' '${{ steps.build_metadata.outputs.archive_name }}'
          $arguments = @{ ArchivePath = $archive; ChecksumPath = "$archive.sha256" }
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $arguments.RequireSignature = $true
          }
          scripts/VerifyRelease.ps1 @arguments

      - name: Upload Verified Windows Bundle
        uses: actions/upload-artifact@v4
        with:
          name: Funke-Editor-${{ steps.build_metadata.outputs.version }}-Windows-x64
          path: |
            bin/Release-windows-x86_64/${{ steps.build_metadata.outputs.archive_name }}
            bin/Release-windows-x86_64/${{ steps.build_metadata.outputs.archive_name }}.sha256
            bin/Release-windows-x86_64/${{ steps.build_metadata.outputs.archive_name }}.sha256.p7s
          if-no-files-found: error

      - name: Upload Private Windows Symbols
        uses: actions/upload-artifact@v4
        with:
          name: Funke-Private-Symbols-${{ steps.build_metadata.outputs.build_id }}
          path: bin/Release-windows-x86_64/PrivateSymbols/${{ steps.build_metadata.outputs.symbols_archive_name }}
          if-no-files-found: error
          retention-days: 90

      - name: Verify Installer Selection, Upgrade and Uninstall
        shell: pwsh
        run: scripts/ci/installer_smoke_test.ps1 -InstallerPath "bin/installer/FunkeSetup-${{ steps.build_metadata.outputs.version }}-Windows-x64.exe"

      - name: Upload Windows Installer
        uses: actions/upload-artifact@v4
        with:
          name: Funke-Installer-${{ steps.build_metadata.outputs.version }}-Windows-x64
          path: |
            bin/installer/*.exe
            bin/installer/*.sha256
            bin/installer/*manifest*.json
            bin/installer/*.dependencies.json
          if-no-files-found: error



      - name: Upload Windows Native Test Diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Funke-Windows-Native-Test-Diagnostics
          path: ci-logs
          if-no-files-found: warn


      - name: Record per-lane CI evidence
        if: always()
        env:
          STEPS_JSON: ${{ toJSON(steps) }}
          CORE_ONLY: ${{ inputs.linux_core_only || false }}
        run: python scripts/ci/check_ci_evidence.py --capture-lane "windows-build" --output ci-evidence/lane.json

      - name: Upload per-lane CI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Funke-CI-Lane-windows-build
          path: ci-evidence/lane.json
          if-no-files-found: error

  windows-standalone:
    needs: windows-build
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - name: Checkout verification script only
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts/ci/standalone_sdk_test.py
            scripts/ci/check_ci_evidence.py
            scripts/ci/test_evidence.py
            scripts/ci/editor_bridge_test.py
            scripts/ci/agent_workflow_test.py
            Tests/Agent
          sparse-checkout-cone-mode: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Setup authoring SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Download published binary bundle
        uses: actions/download-artifact@v4
        with:
          name: Funke-Editor-${{ needs.windows-build.outputs.version }}-Windows-x64
          path: ${{ runner.temp }}/standalone-artifact

      - name: Verify installed authoring and relocated players
        id: standalone
        shell: pwsh
        run: |
          $archives = @(Get-ChildItem -LiteralPath "$env:RUNNER_TEMP/standalone-artifact" -Filter '*.zip')
          if ($archives.Count -ne 1) { throw 'Expected exactly one binary bundle.' }
          $install = Join-Path $env:RUNNER_TEMP 'Funke Binary Installation'
          Expand-Archive -LiteralPath $archives[0].FullName -DestinationPath $install
          python scripts/ci/standalone_sdk_test.py --install $install --dotnet (Get-Command dotnet).Source --work-parent $env:RUNNER_TEMP --forbidden-root $env:GITHUB_WORKSPACE --report "$env:RUNNER_TEMP/standalone-evidence.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify installed agent authoring and gameplay
        id: agent
        shell: pwsh
        run: |
          $install = Join-Path $env:RUNNER_TEMP 'Funke Binary Installation'
          python scripts/ci/editor_bridge_test.py --cli "$install/funke.exe" --editor "$install/Funke-Editor.exe" --output "$env:RUNNER_TEMP/agent-evidence"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/ci/agent_workflow_test.py --cli "$install/funke.exe" --editor "$install/Funke-Editor.exe" --output "$env:RUNNER_TEMP/agent-evidence" --timeout 240
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload standalone verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Funke-Standalone-Windows-${{ needs.windows-build.outputs.version }}
          path: |
            ${{ runner.temp }}/standalone-evidence.json
            ${{ runner.temp }}/agent-evidence/**
            ${{ runner.temp }}/Funke-Standalone-*/logs/**
            ${{ runner.temp }}/agent-evidence/**
          if-no-files-found: warn


      - name: Record per-lane CI evidence
        if: always()
        env:
          STEPS_JSON: ${{ toJSON(steps) }}
          CORE_ONLY: ${{ inputs.linux_core_only || false }}
        run: python scripts/ci/check_ci_evidence.py --capture-lane "windows-standalone" --output ci-evidence/lane.json

      - name: Upload per-lane CI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Funke-CI-Lane-windows-standalone
          path: ci-evidence/lane.json
          if-no-files-found: error

  linux-build:
    if: ${{ !cancelled() && (inputs.linux_core_only || ((github.event_name != 'workflow_dispatch' || inputs.platforms != 'macos') && needs.script-tests.result == 'success')) }}
    needs: script-tests
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Verify Vendor Patch Inputs
        run: python3 scripts/vendor_patches.py verify

      - name: Install Native Dependencies
        timeout-minutes: 15
        run: |
          apt_options=(-o Acquire::Retries=2 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20)
          if ! sudo apt-get "${apt_options[@]}" --error-on=any update; then
            # The hosted mirror list can keep choosing Azure after DNS failures; retry the official Ubuntu mirrors.
            mirror_list=/etc/apt/apt-mirrors.txt
            if [[ ! -f "$mirror_list" ]] || ! grep -q '://azure.archive.ubuntu.com/' "$mirror_list"; then
              exit 1
            fi
            sudo sed -i '\|://azure.archive.ubuntu.com/|d' "$mirror_list"
            sudo apt-get "${apt_options[@]}" --error-on=any update
          fi
          # xorg-dev, libwayland-dev, libxkbcommon-dev, wayland-protocols, libdbus-1-dev,
          # libudev-dev: SDL3's X11/Wayland video, portal dialogs and gamepad hotplug
          # (scripts/sdl/SetupSDL.py, run by Setup). pkg-config: Dawn's CMake dep probing when
          # building webgpu_dawn from source. xvfb: headless runtime smoke test.
          # clang: Dawn's build is Clang-oriented and fails to compile under GCC 13.
          # Keep GCC's default GNU linker: Dist uses GCC LTO, which LLD cannot read.
          # Dawn is shared, so its former static-archive linker memory issue no longer applies.
          # libx11-xcb-dev: Dawn's X11 backend needs X11/Xlib-xcb.h (not in xorg-dev).
          sudo apt-get "${apt_options[@]}" install -y xorg-dev libglu1-mesa-dev xvfb pkg-config clang libx11-xcb-dev lcov \
            libwayland-dev libxkbcommon-dev wayland-protocols libdbus-1-dev libudev-dev \
            libvulkan1 mesa-vulkan-drivers vulkan-tools

      - name: Verify Software Vulkan Driver
        run: |
          driver=$(find /usr/share/vulkan/icd.d -name 'lvp_icd*.json' -print -quit)
          test -n "$driver"
          echo "VK_DRIVER_FILES=$driver" >> "$GITHUB_ENV"
          VK_DRIVER_FILES="$driver" vulkaninfo --summary

      - name: Install Premake
        run: |
          # vendor/bin/ only contains premake5.exe (Windows) in the repo.
          # Fetch the matching Linux binary so Setup.sh can find it via the
          # vendored path the same way the Windows job does.
          PREMAKE_VERSION="5.0.0-beta5"
          URL="https://github.com/premake/premake-core/releases/download/v${PREMAKE_VERSION}/premake-${PREMAKE_VERSION}-linux.tar.gz"
          mkdir -p vendor/bin
          curl --fail --location --proto '=https' "$URL" -o "$RUNNER_TEMP/premake-linux.tar.gz"
          echo "38b8e445aac28f8ef1d5b7e4faeb67ee7b7b650e0c3da0f2a9f99620256a5466  $RUNNER_TEMP/premake-linux.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/premake-linux.tar.gz" -C vendor/bin premake5
          chmod +x vendor/bin/premake5
          vendor/bin/premake5 --version

      # See the windows-build job for why CI builds Dawn. On Linux SetupDawn.sh
      # is single-config: the shared lib lands at .../native/libwebgpu_dawn.so
      # (no Release/ subfolder). Keeping Dawn shared avoids pulling its large
      # monolithic archive into libFunke-Engine.so during the CI link.
      - name: Restore Dawn cache
        id: cache-dawn
        uses: actions/cache/restore@v4
        with:
          path: |
            External/dawn/include
            External/dawn/build/gen/include
            External/dawn/build/src/dawn/native/libwebgpu_dawn.so
            External/dawn/LICENSE
            External/dawn/funke-artifacts.json
            External/dawn/third_party/**/LICENSE*
            External/dawn/third_party/**/NOTICE*
            External/dawn/third_party/**/COPYING*
          key: dawn-v5-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/dawn/*.txt', 'scripts/dawn/*.py', 'scripts/dawn/*.sh', 'scripts/dawn/*.bat', 'scripts/dawn/*.ps1', 'scripts/dawn/patches/**') }}

      - name: Validate Dawn artifacts
        id: validate-dawn
        run: python scripts/dawn/ValidateDawnCache.py --ci

      - name: Build Dawn (missing or invalid artifacts)
        if: steps.validate-dawn.outputs.valid != 'true'
        run: |
          chmod +x scripts/dawn/SetupDawn.sh
          ./scripts/dawn/SetupDawn.sh

      - name: Save Dawn cache
        if: steps.cache-dawn.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            External/dawn/include
            External/dawn/build/gen/include
            External/dawn/build/src/dawn/native/libwebgpu_dawn.so
            External/dawn/LICENSE
            External/dawn/funke-artifacts.json
            External/dawn/third_party/**/LICENSE*
            External/dawn/third_party/**/NOTICE*
            External/dawn/third_party/**/COPYING*
          key: ${{ steps.cache-dawn.outputs.cache-primary-key }}

      - name: Generate Makefiles
        run: |
          chmod +x scripts/Setup.sh
          chmod +x vendor/bin/premake5 || true
          ./scripts/Setup.sh

      - name: Verify Vendor Patches Applied
        run: python3 scripts/vendor_patches.py verify --require-applied

      - name: Linux Engine + Editor Tests
        id: native_release
        if: ${{ !inputs.linux_core_only }}
        run: |
          metadata_flags=(--require-clean)
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then metadata_flags+=(--tag "$GITHUB_REF_NAME"); fi
          python3 scripts/generate_build_metadata.py "${metadata_flags[@]}"
          make config=release verbose=1 -j"$(nproc)" Funke-Managed Funke-Engine-Tests Funke-Editor-Tests
          ./bin/Release-linux-x86_64/Funke-Engine-Tests/Funke-Engine-Tests
          ./bin/Release-linux-x86_64/Funke-Editor-Tests/Funke-Editor-Tests

      - name: Managed and native job lifetime integration
        if: ${{ !inputs.linux_core_only }}
        run: |
          core="$PWD/bin/Release-linux-x86_64/Funke-ScriptCore/Funke-ScriptCore.dll"
          dotnet build Tests/Fixtures/HotReloadProbe/HotReloadProbe.csproj -c Release \
            -p:FunkeScriptCore="$core" -o bin-int/memory-job-probe --nologo
          FUNKE_TEST_SCRIPTCORE="$core" \
          FUNKE_TEST_RELOAD_ASSEMBLY="$PWD/bin-int/memory-job-probe/HotReloadProbe.dll" \
            ./bin/Release-linux-x86_64/Funke-Engine-Tests/Funke-Engine-Tests \
            --test-case="Backlog managed reload*"

      - name: Required GPU readbacks (software Vulkan)
        id: gpu
        if: ${{ !inputs.linux_core_only }}
        env:
          FUNKE_TEST_RENDER_GPU: "1"
          FUNKE_TEST_ASYNC_ASSET_GPU: "1"
          FUNKE_TEST_GPU_REQUIRED: "1"
          FUNKE_TEST_SCRIPTCORE: ${{ github.workspace }}/bin/Release-linux-x86_64/Funke-ScriptCore/Funke-ScriptCore.dll
          FUNKE_TEST_RELOAD_ASSEMBLY: ${{ github.workspace }}/bin-int/memory-job-probe/HotReloadProbe.dll
        run: |
          xvfb-run -a python3 scripts/ci/gpu_render_test.py \
            --binary bin/Release-linux-x86_64/Funke-Engine-Tests/Funke-Engine-Tests \
            --adapter software --backend Vulkan --negative-probe \
            --output "$RUNNER_TEMP/gpu-software-evidence"

      - name: Upload GPU adapter, readback and negative-probe evidence
        if: ${{ always() && !inputs.linux_core_only }}
        uses: actions/upload-artifact@v4
        with:
          name: Funke-GPU-Software-Vulkan
          path: ${{ runner.temp }}/gpu-software-evidence
          if-no-files-found: error

      # Funke-Managed builds Funke-ScriptCore, the hot-reload compiler and the package tool with dotnet;
      # the Launcher's postbuild bundles everything into EngineSDK (scripts/CopyEngineSdk.py).
      - name: Build Linux Targets
        if: ${{ !inputs.linux_core_only }}
        run: |
          make config=dist verbose=1 -j"$(nproc)" Funke-Runtime
          make config=release verbose=1 -j"$(nproc)" Funke-Engine Funke-Managed Funke-Runtime Funke-Editor Funke-CLI Funke-Launcher

      - name: Linux Native Scripting Convenience SDK Test
        if: ${{ !inputs.linux_core_only }}
        run: python3 scripts/ci/native_scripting_test.py --sdk bin/Release-linux-x86_64/Funke-Launcher/EngineSDK --test-exe bin/Release-linux-x86_64/Funke-Editor-Tests/Funke-Editor-Tests --output bin-int/native-scripting-ci --generator "Unix Makefiles"

      - name: Linux rendering-only runtime and CMake module graphs
        if: ${{ !inputs.linux_core_only }}
        run: |
          python3 scripts/ci/physics_cmake_matrix.py
          python3 scripts/ci/physics_module_matrix.py --build --variant v2-2d-3d

      - name: Preserve Linux physics module evidence
        if: ${{ always() && !inputs.linux_core_only }}
        uses: actions/upload-artifact@v4
        with:
          name: Funke-Physics-Modules-Linux
          path: |
            bin-int/_agent/physics-module-matrix
            bin-int/_agent/physics-cmake-matrix
          if-no-files-found: error

      - name: Package Linux Bundle
        if: ${{ !inputs.linux_core_only }}
        run: python3 scripts/PackagePosix.py --configuration Release --output-dir dist-posix

      - name: Build Linux Installer
        if: ${{ !inputs.linux_core_only }}
        run: |
          flags=()
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then flags+=(--require-release); fi
          python3 scripts/BuildLinuxInstaller.py --bundle-dir bin/Release-linux-x86_64/Funke-Launcher --output-dir dist-installer "${flags[@]}"

      - name: Linux Installer Smoke Test
        id: installer
        if: ${{ !inputs.linux_core_only }}
        run: python3 installer/linux/smoke_test.py --installer dist-installer/FunkeSetup-*-Linux-x64.run --report "${{ runner.temp }}/funke-linux-installer-evidence.json"

      - name: Upload Linux Installer Evidence
        if: ${{ always() && !inputs.linux_core_only }}
        uses: actions/upload-artifact@v4
        with:
          name: Funke-Linux-Installer-Evidence
          path: |
            ${{ runner.temp }}/funke-linux-installer-evidence.json
            ${{ runner.temp }}/Funke Linux Installer */logs/*
          if-no-files-found: ignore

      - name: Upload Linux Installer
        if: ${{ !inputs.linux_core_only }}
        uses: actions/upload-artifact@v4
        with:
          name: Funke-Installer-Linux-x64
          path: dist-installer/*
          if-no-files-found: error

      - name: Upload Linux Bundle
        if: ${{ !inputs.linux_core_only }}
        uses: actions/upload-artifact@v4
        with:
          name: Funke-Editor-Linux-x64
          path: dist-posix/*.tar.gz
          if-no-files-found: error

      - name: Build Linux Debug Targets
        if: ${{ !inputs.linux_core_only }}
        run: make config=debug verbose=1 -j"$(nproc)" Funke-Engine Funke-Runtime Funke-Editor

      - name: Linux Runtime Smoke Test
        id: runtime
        if: ${{ !inputs.linux_core_only }}
        run: python3 scripts/ci/runtime_smoke_test.py --binary bin/Release-linux-x86_64/Funke-Runtime/Funke-Runtime

      - name: Linux Missing Graphics Driver Test
        if: ${{ !inputs.linux_core_only }}
        env:
          VK_DRIVER_FILES: /nonexistent/funke-vulkan-driver.json
          VK_ICD_FILENAMES: /nonexistent/funke-vulkan-driver.json
        run: python3 scripts/ci/runtime_smoke_test.py --binary bin/Release-linux-x86_64/Funke-Runtime/Funke-Runtime --expect-render-init-failure

      - name: Linux Export With Bundled .NET
        if: ${{ !inputs.linux_core_only }}
        run: python3 scripts/ci/desktop_export_smoke_test.py --cli bin/Release-linux-x86_64/Funke-CLI/funke

      - name: Linux Agent Editor Workflow
        id: agent
        if: ${{ !inputs.linux_core_only }}
        run: |
          xvfb-run -a python3 scripts/ci/editor_bridge_test.py --cli bin/Release-linux-x86_64/Funke-CLI/funke --editor bin/Release-linux-x86_64/Funke-Editor/Funke-Editor --output "$RUNNER_TEMP/agent-evidence"
          xvfb-run -a python3 scripts/ci/agent_workflow_test.py --cli bin/Release-linux-x86_64/Funke-CLI/funke --editor bin/Release-linux-x86_64/Funke-Editor/Funke-Editor --output "$RUNNER_TEMP/agent-evidence" --timeout 240

      - name: Upload Linux Agent Evidence
        if: ${{ always() && !inputs.linux_core_only }}
        uses: actions/upload-artifact@v4
        with:
          name: Funke-Agent-Linux
          path: ${{ runner.temp }}/agent-evidence
          if-no-files-found: warn

      - name: Linux Debug Runtime Smoke Test
        id: runtime_debug
        if: ${{ !inputs.linux_core_only }}
        run: python3 scripts/ci/runtime_smoke_test.py --binary bin/Debug-linux-x86_64/Funke-Runtime/Funke-Runtime

      - name: Linux Dist Runtime Smoke Test
        id: runtime_dist
        if: ${{ !inputs.linux_core_only }}
        run: python3 scripts/ci/runtime_smoke_test.py --binary bin/Dist-linux-x86_64/Funke-Runtime/Funke-Runtime --require-scripting

      - name: Linux Debug Engine + Editor Tests
        id: native_debug
        if: ${{ !inputs.linux_core_only }}
        run: |
          make config=debug verbose=1 -j"$(nproc)" Funke-Engine-Tests Funke-Editor-Tests
          ./bin/Debug-linux-x86_64/Funke-Engine-Tests/Funke-Engine-Tests
          ./bin/Debug-linux-x86_64/Funke-Editor-Tests/Funke-Editor-Tests

      - name: Generate Core-only Build Identity
        if: ${{ inputs.linux_core_only }}
        run: python3 scripts/generate_build_metadata.py --require-clean

      - name: Linux Core-only Engine Validation
        id: core
        run: |
          vendor/bin/premake5 --core-validation --module-profile=core gmake
          make -C premake/generated/core config=release verbose=1 -j"$(nproc)" Funke-Engine


      - name: Record per-lane CI evidence
        if: always()
        env:
          STEPS_JSON: ${{ toJSON(steps) }}
          CORE_ONLY: ${{ inputs.linux_core_only || false }}
        run: python scripts/ci/check_ci_evidence.py --capture-lane "linux-build" --output ci-evidence/lane.json

      - name: Upload per-lane CI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Funke-CI-Lane-linux-build
          path: ci-evidence/lane.json
          if-no-files-found: error

  linux-instrumentation:
    name: Linux ${{ matrix.check }}
    if: ${{ !inputs.linux_core_only && (github.event_name != 'workflow_dispatch' || inputs.platforms != 'macos') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        check: [sanitize, coverage]
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Verify Vendor Patch Inputs
        run: python3 scripts/vendor_patches.py verify

      - name: Install Native Dependencies
        timeout-minutes: 15
        run: |
          apt_options=(-o Acquire::Retries=2 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20)
          if ! sudo apt-get "${apt_options[@]}" --error-on=any update; then
            # The hosted mirror list can keep choosing Azure after DNS failures; retry the official Ubuntu mirrors.
            mirror_list=/etc/apt/apt-mirrors.txt
            if [[ ! -f "$mirror_list" ]] || ! grep -q '://azure.archive.ubuntu.com/' "$mirror_list"; then
              exit 1
            fi
            sudo sed -i '\|://azure.archive.ubuntu.com/|d' "$mirror_list"
            sudo apt-get "${apt_options[@]}" --error-on=any update
          fi
          # xorg-dev, libwayland-dev, libxkbcommon-dev, wayland-protocols, libdbus-1-dev,
          # libudev-dev: SDL3's X11/Wayland video, portal dialogs and gamepad hotplug
          # (scripts/sdl/SetupSDL.py, run by Setup). pkg-config: Dawn's CMake dep probing when
          # building webgpu_dawn from source. xvfb: headless runtime smoke test.
          # clang: Dawn's build is Clang-oriented and fails to compile under GCC 13.
          # Keep GCC's default GNU linker: Dist uses GCC LTO, which LLD cannot read.
          # Dawn is shared, so its former static-archive linker memory issue no longer applies.
          # libx11-xcb-dev: Dawn's X11 backend needs X11/Xlib-xcb.h (not in xorg-dev).
          sudo apt-get "${apt_options[@]}" install -y xorg-dev libglu1-mesa-dev xvfb pkg-config clang libx11-xcb-dev lcov \
            libwayland-dev libxkbcommon-dev wayland-protocols libdbus-1-dev libudev-dev \
            libvulkan1 mesa-vulkan-drivers vulkan-tools

      - name: Install Premake
        run: |
          # vendor/bin/ only contains premake5.exe (Windows) in the repo.
          # Fetch the matching Linux binary so Setup.sh can find it via the
          # vendored path the same way the Windows job does.
          PREMAKE_VERSION="5.0.0-beta5"
          URL="https://github.com/premake/premake-core/releases/download/v${PREMAKE_VERSION}/premake-${PREMAKE_VERSION}-linux.tar.gz"
          mkdir -p vendor/bin
          curl --fail --location --proto '=https' "$URL" -o "$RUNNER_TEMP/premake-linux.tar.gz"
          echo "38b8e445aac28f8ef1d5b7e4faeb67ee7b7b650e0c3da0f2a9f99620256a5466  $RUNNER_TEMP/premake-linux.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/premake-linux.tar.gz" -C vendor/bin premake5
          chmod +x vendor/bin/premake5
          vendor/bin/premake5 --version

      # See the windows-build job for why CI builds Dawn. On Linux SetupDawn.sh
      # is single-config: the shared lib lands at .../native/libwebgpu_dawn.so
      # (no Release/ subfolder). Keeping Dawn shared avoids pulling its large
      # monolithic archive into libFunke-Engine.so during the CI link.
      - name: Restore Dawn cache
        id: cache-dawn
        uses: actions/cache/restore@v4
        with:
          path: |
            External/dawn/include
            External/dawn/build/gen/include
            External/dawn/build/src/dawn/native/libwebgpu_dawn.so
            External/dawn/LICENSE
            External/dawn/funke-artifacts.json
            External/dawn/third_party/**/LICENSE*
            External/dawn/third_party/**/NOTICE*
            External/dawn/third_party/**/COPYING*
          key: dawn-v5-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/dawn/*.txt', 'scripts/dawn/*.py', 'scripts/dawn/*.sh', 'scripts/dawn/*.bat', 'scripts/dawn/*.ps1', 'scripts/dawn/patches/**') }}

      - name: Validate Dawn artifacts
        id: validate-dawn
        run: python scripts/dawn/ValidateDawnCache.py --ci

      - name: Build Dawn (missing or invalid artifacts)
        if: steps.validate-dawn.outputs.valid != 'true'
        run: |
          chmod +x scripts/dawn/SetupDawn.sh
          ./scripts/dawn/SetupDawn.sh

      - name: Save Dawn cache
        if: steps.cache-dawn.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            External/dawn/include
            External/dawn/build/gen/include
            External/dawn/build/src/dawn/native/libwebgpu_dawn.so
            External/dawn/LICENSE
            External/dawn/funke-artifacts.json
            External/dawn/third_party/**/LICENSE*
            External/dawn/third_party/**/NOTICE*
            External/dawn/third_party/**/COPYING*
          key: ${{ steps.cache-dawn.outputs.cache-primary-key }}

      - name: Generate Makefiles
        run: |
          chmod +x scripts/Setup.sh
          chmod +x vendor/bin/premake5 || true
          ./scripts/Setup.sh

      - name: Verify Vendor Patches Applied
        run: python3 scripts/vendor_patches.py verify --require-applied

      - name: Record instrumentation inputs
        run: |
          mkdir -p ci-logs
          metadata_flags=(--require-clean)
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then metadata_flags+=(--tag "$GITHUB_REF_NAME"); fi
          python3 scripts/generate_build_metadata.py "${metadata_flags[@]}"
          { git rev-parse HEAD; git submodule status --recursive; g++ --version; gcov --version; lcov --version; genhtml --version; } > ci-logs/inputs.log
          vendor/bin/premake5 --${{ matrix.check }} --no-profiler gmake

      - name: ASan + UBSan build and tests
        id: sanitize
        if: matrix.check == 'sanitize'
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1:strict_string_checks=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          python3 scripts/BuildManaged.py --configuration Debug --output-dir bin/Debug-linux-x86_64-sanitized --projects ScriptCore
          make config=debug verbose=1 LDFLAGS="-fsanitize=address,undefined -fno-sanitize-recover=all" -j"$(nproc)" Funke-Engine-Tests 2>&1 | tee ci-logs/sanitize-build.log
          ./bin/Debug-linux-x86_64-sanitized/Funke-Engine-Tests/Funke-Engine-Tests --reporters=xml --out=ci-logs/sanitize-tests.xml 2>&1 | tee ci-logs/sanitize-tests.log

      - name: Coverage build and tests
        id: coverage_tests
        if: matrix.check == 'coverage'
        run: |
          python3 scripts/BuildManaged.py --configuration Debug --output-dir bin/Debug-linux-x86_64-coverage --projects ScriptCore
          make config=debug verbose=1 LDFLAGS="--coverage" -j"$(nproc)" Funke-Engine-Tests 2>&1 | tee ci-logs/coverage-build.log
          ./bin/Debug-linux-x86_64-coverage/Funke-Engine-Tests/Funke-Engine-Tests 2>&1 | tee ci-logs/coverage-tests.log

      - name: Capture and validate coverage
        id: coverage
        if: matrix.check == 'coverage'
        run: |
          lcov --capture --directory bin-int/Debug-linux-x86_64-coverage --output-file coverage-raw.info --ignore-errors mismatch 2>&1 | tee ci-logs/coverage-capture.log
          lcov --remove coverage-raw.info '*/External/*' '*/vendor/*' '*/Tests/*' '/usr/*' --output-file coverage.info --ignore-errors unused 2>&1 | tee ci-logs/coverage-filter.log
          python3 scripts/ci/coverage_report.py coverage.info --commit "$GITHUB_SHA" --output coverage-summary.json --summary "$GITHUB_STEP_SUMMARY"
          genhtml coverage.info --output-directory coverage-html 2>&1 | tee ci-logs/coverage-html.log

      - name: Upload instrumentation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Funke-Linux-${{ matrix.check }}-Evidence
          path: |
            ci-logs
            coverage-raw.info
            coverage.info
            coverage-summary.json
            coverage-html
            build/BuildMetadata.json
          if-no-files-found: error


      - name: Record per-lane CI evidence
        if: always()
        env:
          STEPS_JSON: ${{ toJSON(steps) }}
          CORE_ONLY: ${{ inputs.linux_core_only || false }}
        run: python scripts/ci/check_ci_evidence.py --capture-lane "linux-instrumentation/${{ matrix.check }}" --results ci-logs/sanitize-tests.xml --output ci-evidence/lane.json

      - name: Upload per-lane CI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Funke-CI-Lane-linux-instrumentation-${{ matrix.check }}
          path: ci-evidence/lane.json
          if-no-files-found: error

  macos-build:
    if: ${{ !inputs.linux_core_only && (github.event_name != 'workflow_dispatch' || inputs.platforms != 'linux') }}
    needs: script-tests
    # Apple Silicon. Builds the engine, editor, launcher and CLI natively (Dawn on Metal) and runs the
    # doctest suites. Public DMG installers require Developer ID signing and notarization.
    # macOS 15 supplies Clang 17; Dawn's aggregate CTAD needs that compiler generation.
    runs-on: macos-15
    env:
      MACOSX_DEPLOYMENT_TARGET: "15.0"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Verify Vendor Patch Inputs
        run: python3 scripts/vendor_patches.py verify

      - name: Install Premake
        run: |
          python3 scripts/ci/setup_macos_premake.py

      - name: Restore Dawn cache
        id: cache-dawn
        uses: actions/cache/restore@v4
        with:
          path: |
            External/dawn/include
            External/dawn/build/gen/include
            External/dawn/build/src/dawn/native/libwebgpu_dawn.dylib
            External/dawn/LICENSE
            External/dawn/funke-artifacts.json
            External/dawn/third_party/**/LICENSE*
            External/dawn/third_party/**/NOTICE*
            External/dawn/third_party/**/COPYING*
          key: dawn-v5-macos-15-${{ runner.arch }}-${{ hashFiles('scripts/dawn/*.txt', 'scripts/dawn/*.py', 'scripts/dawn/*.sh', 'scripts/dawn/*.bat', 'scripts/dawn/*.ps1', 'scripts/dawn/patches/**') }}

      - name: Validate Dawn artifacts
        id: validate-dawn
        run: python scripts/dawn/ValidateDawnCache.py --ci

      - name: Build Dawn (missing or invalid artifacts)
        if: steps.validate-dawn.outputs.valid != 'true'
        run: |
          chmod +x scripts/dawn/SetupDawn.sh
          ./scripts/dawn/SetupDawn.sh

      - name: Save Dawn cache
        if: steps.cache-dawn.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            External/dawn/include
            External/dawn/build/gen/include
            External/dawn/build/src/dawn/native/libwebgpu_dawn.dylib
            External/dawn/LICENSE
            External/dawn/funke-artifacts.json
            External/dawn/third_party/**/LICENSE*
            External/dawn/third_party/**/NOTICE*
            External/dawn/third_party/**/COPYING*
          key: ${{ steps.cache-dawn.outputs.cache-primary-key }}

      - name: Generate Makefiles
        run: |
          chmod +x scripts/Setup.sh
          ./scripts/Setup.sh

      - name: Verify Vendor Patches Applied
        run: python3 scripts/vendor_patches.py verify --require-applied

      - name: macOS Native Hosting and Signing Regression Tests
        shell: bash
        run: |
          metadata_flags=(--require-clean)
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then metadata_flags+=(--tag "$GITHUB_REF_NAME"); fi
          python3 scripts/generate_build_metadata.py "${metadata_flags[@]}"
          mkdir -p ci-logs
          python3 -m unittest scripts.ci.test_macos_native -v 2>&1 | tee ci-logs/macos-native.log

      - name: Build macOS Native Tests
        shell: bash
        run: make config=release verbose=1 -j"$(sysctl -n hw.ncpu)" Funke-Managed Funke-Engine-Tests Funke-Editor-Tests 2>&1 | tee ci-logs/macos-build.log

      - name: macOS Engine Tests
        id: native_engine
        shell: bash
        run: ./bin/Release-macosx-arm64/Funke-Engine-Tests/Funke-Engine-Tests 2>&1 | tee ci-logs/macos-engine-tests.log

      - name: macOS Editor Tests
        id: native_editor
        shell: bash
        run: ./bin/Release-macosx-arm64/Funke-Editor-Tests/Funke-Editor-Tests 2>&1 | tee ci-logs/macos-editor-tests.log

      - name: Build macOS Targets
        run: |
          make config=dist verbose=1 -j"$(sysctl -n hw.ncpu)" Funke-Runtime
          make config=release verbose=1 -j"$(sysctl -n hw.ncpu)" Funke-Engine Funke-Managed Funke-Runtime Funke-Editor Funke-CLI Funke-Launcher

      - name: macOS Native Scripting Convenience SDK Test
        run: python3 scripts/ci/native_scripting_test.py --sdk bin/Release-macosx-arm64/Funke-Launcher/EngineSDK --test-exe bin/Release-macosx-arm64/Funke-Editor-Tests/Funke-Editor-Tests --output bin-int/native-scripting-ci --generator "Unix Makefiles"

      - name: macOS rendering-only runtime and CMake module graphs
        run: |
          python3 scripts/ci/physics_cmake_matrix.py
          python3 scripts/ci/physics_module_matrix.py --build --variant v2-2d-3d

      - name: Preserve macOS physics module evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Funke-Physics-Modules-macOS
          path: |
            bin-int/_agent/physics-module-matrix
            bin-int/_agent/physics-cmake-matrix
          if-no-files-found: error

      - name: macOS Runtime Smoke Tests
        id: runtime
        run: |
          python3 scripts/ci/runtime_smoke_test.py --binary bin/Release-macosx-arm64/Funke-Runtime/Funke-Runtime --require-scripting
          python3 scripts/ci/runtime_smoke_test.py --binary bin/Dist-macosx-arm64/Funke-Runtime/Funke-Runtime --require-scripting

      - name: macOS Export With Bundled .NET
        run: python3 scripts/ci/desktop_export_smoke_test.py --cli bin/Release-macosx-arm64/Funke-CLI/funke

      - name: macOS Agent Editor Workflow
        run: |
          python3 scripts/ci/editor_bridge_test.py --cli bin/Release-macosx-arm64/Funke-CLI/funke --editor bin/Release-macosx-arm64/Funke-Editor/Funke-Editor --output "$RUNNER_TEMP/agent-evidence"
          python3 scripts/ci/agent_workflow_test.py --cli bin/Release-macosx-arm64/Funke-CLI/funke --editor bin/Release-macosx-arm64/Funke-Editor/Funke-Editor --output "$RUNNER_TEMP/agent-evidence" --timeout 240

      - name: Upload macOS Agent Evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Funke-Agent-macOS
          path: ${{ runner.temp }}/agent-evidence
          if-no-files-found: warn

      - name: Package macOS Bundle
        run: python3 scripts/PackagePosix.py --configuration Release --output-dir dist-posix

      - name: Upload macOS Bundle
        uses: actions/upload-artifact@v4
        with:
          name: Funke-Editor-macOS-arm64
          path: dist-posix/*.tar.gz
          if-no-files-found: error

      - name: Prepare macOS Signing
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          flags=()
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then flags+=(--require); fi
          python3 installer/macos/signing.py prepare "${flags[@]}"

      - name: Build macOS Installer
        shell: bash
        run: |
          flags=()
          if [[ -n "${FUNKE_MAC_SIGNING_IDENTITY:-}" ]]; then
            flags+=(--signing-identity "$FUNKE_MAC_SIGNING_IDENTITY" --signing-keychain "$FUNKE_MAC_SIGNING_KEYCHAIN" --notary-keychain-profile "$FUNKE_MAC_NOTARY_KEYCHAIN_PROFILE")
          fi
          python3 scripts/BuildMacInstaller.py --bundle bin/Release-macosx-arm64/Funke-Launcher --output-dir dist-installer "${flags[@]}" 2>&1 | tee ci-logs/macos-installer.log

      - name: Clean Up macOS Signing
        if: always()
        run: python3 installer/macos/signing.py cleanup

      - name: macOS Installer Smoke Test
        id: installer
        shell: bash
        run: python3 installer/macos/smoke_test.py --installer dist-installer/FunkeSetup-*-macOS-arm64.dmg --require-scripting 2>&1 | tee ci-logs/macos-installed.log

      - name: Upload macOS Diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Funke-macOS-Diagnostics
          path: ci-logs
          if-no-files-found: warn

      - name: Upload macOS Installer
        uses: actions/upload-artifact@v4
        with:
          name: Funke-Installer-macOS-arm64
          path: dist-installer/*
          if-no-files-found: error


      - name: Record per-lane CI evidence
        if: always()
        env:
          STEPS_JSON: ${{ toJSON(steps) }}
          CORE_ONLY: ${{ inputs.linux_core_only || false }}
        run: python scripts/ci/check_ci_evidence.py --capture-lane "macos-build" --output ci-evidence/lane.json

      - name: Upload per-lane CI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Funke-CI-Lane-macos-build
          path: ci-evidence/lane.json
          if-no-files-found: error

  ci-evidence:
    if: always()
    needs: [script-tests, managed-tests, windows-build, windows-standalone, linux-build, linux-instrumentation, macos-build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download per-lane evidence
        if: always()
        uses: actions/download-artifact@v4
        with:
          pattern: Funke-CI-Lane-*
          path: ci-lanes
      - name: Summarize required checks
        if: always()
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          VALIDATION_PLATFORMS: ${{ inputs.platforms || 'all' }}
          CORE_ONLY: ${{ inputs.linux_core_only || false }}
        run: python3 scripts/ci/check_ci_evidence.py --summary "$GITHUB_STEP_SUMMARY" --evidence-dir ci-lanes --output ci-evidence.json
      - name: Upload aggregate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Funke-CI-Evidence
          path: ci-evidence.json
          if-no-files-found: error

  # Tags only: turn the verified, signed bundle into a DRAFT GitHub Release. Review and publish it by hand
  # after the clean-machine checks in Building-and-Shipping.md.
  publish-release:
    if: github.ref_type == 'tag'
    needs: [ci-evidence, managed-tests, windows-build, windows-standalone, linux-build, linux-instrumentation, macos-build]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Verified Windows Bundle
        uses: actions/download-artifact@v4
        with:
          name: Funke-Editor-${{ needs.windows-build.outputs.version }}-Windows-x64
          path: release

      - name: Download Windows Installer
        uses: actions/download-artifact@v4
        with:
          name: Funke-Installer-${{ needs.windows-build.outputs.version }}-Windows-x64
          path: release

      - name: Download Linux Bundle
        uses: actions/download-artifact@v4
        with:
          name: Funke-Editor-Linux-x64
          path: release

      - name: Download macOS Bundle
        uses: actions/download-artifact@v4
        with:
          name: Funke-Editor-macOS-arm64
          path: release

      - name: Download Linux Installer
        uses: actions/download-artifact@v4
        with:
          name: Funke-Installer-Linux-x64
          path: release

      - name: Download macOS Installer
        uses: actions/download-artifact@v4
        with:
          name: Funke-Installer-macOS-arm64
          path: release

      - name: Create Draft Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.windows-build.outputs.version }}
        run: |
          awk -v heading="## [$VERSION]" 'index($0, heading) == 1 { found = 1; next } /^## \[/ { found = 0 } found' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "CHANGELOG.md has no notes for $VERSION" >&2
            exit 1
          fi
          flags=(--draft --verify-tag --title "Funke $VERSION" --notes-file release-notes.md)
          if [[ "$VERSION" == *-* ]]; then
            flags+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" release/* "${flags[@]}"
