name: CI

on:
  push:
  pull_request:

jobs:
  windows-build:
    runs-on: windows-2022
    outputs:
      version: ${{ steps.build_metadata.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Generate and Validate Build Identity
        id: build_metadata
        shell: pwsh
        run: |
          $arguments = @('--require-clean', '--github-output', $env:GITHUB_OUTPUT)
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $arguments += @('--tag', $env:GITHUB_REF_NAME)
          }
          python scripts/generate_build_metadata.py @arguments

      - name: Validate Tag Signing Configuration
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          INDEX_SIGNING_CERTIFICATE_BASE64: ${{ secrets.INDEX_SIGNING_CERTIFICATE_BASE64 }}
          INDEX_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.INDEX_SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:INDEX_SIGNING_CERTIFICATE_BASE64)) {
            throw 'Tagged releases require the INDEX_SIGNING_CERTIFICATE_BASE64 secret.'
          }
          if ([string]::IsNullOrWhiteSpace($env:INDEX_SIGNING_CERTIFICATE_PASSWORD)) {
            throw 'Tagged releases require the INDEX_SIGNING_CERTIFICATE_PASSWORD secret.'
          }
          try {
            [Convert]::FromBase64String($env:INDEX_SIGNING_CERTIFICATE_BASE64) | Out-Null
          }
          catch {
            throw 'INDEX_SIGNING_CERTIFICATE_BASE64 is not valid base64.'
          }

      - name: Release Script Tests
        run: python -m unittest scripts.ci.test_release_scripts

      - name: Verify Vendor Patch Inputs
        shell: pwsh
        run: python scripts/vendor_patches.py verify

      # WebGPU/Dawn is the engine's only graphics backend. External/dawn/ is
      # git-ignored and built out-of-band by scripts/dawn/SetupDawn.bat, so CI
      # has to produce webgpu_dawn.lib + the webgpu/ headers itself or the ImGui
      # backend fails with `C1083: webgpu/webgpu.h` and the engine fails to link.
      # The build is ~30-60 min, so cache it keyed on the pinned Dawn revision
      # (scripts/dawn/dawn-revision.txt) + the build scripts. Restore/build/save
      # is split so a cache-miss build is saved even if a later step fails.
      - name: Restore Dawn cache
        id: cache-dawn
        uses: actions/cache/restore@v4
        with:
          path: |
            External/dawn/include
            External/dawn/build/gen/include
            External/dawn/build/src/dawn/native/Debug/webgpu_dawn.lib
            External/dawn/build/src/dawn/native/Release/webgpu_dawn.lib
            External/dawn/LICENSE
            External/dawn/third_party/**/LICENSE*
            External/dawn/third_party/**/NOTICE*
            External/dawn/third_party/**/COPYING*
            External/dawn/third_party/**/ThirdPartyNotices.txt
          key: dawn-v2-${{ runner.os }}-${{ hashFiles('scripts/dawn/dawn-revision.txt', 'scripts/dawn/SetupDawn.bat', 'scripts/dawn/FetchDawnDepsMinimal.py', 'scripts/dawn/patches/**') }}

      - name: Build Dawn (cache miss only)
        if: steps.cache-dawn.outputs.cache-hit != 'true'
        shell: cmd
        env:
          DAWN_BUILD_CONFIGS: Debug Release
          DAWN_SKIP_PREMAKE: "1"
        run: scripts\dawn\SetupDawn.bat

      - name: Save Dawn cache
        if: steps.cache-dawn.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            External/dawn/include
            External/dawn/build/gen/include
            External/dawn/build/src/dawn/native/Debug/webgpu_dawn.lib
            External/dawn/build/src/dawn/native/Release/webgpu_dawn.lib
            External/dawn/LICENSE
            External/dawn/third_party/**/LICENSE*
            External/dawn/third_party/**/NOTICE*
            External/dawn/third_party/**/COPYING*
            External/dawn/third_party/**/ThirdPartyNotices.txt
          key: ${{ steps.cache-dawn.outputs.cache-primary-key }}

      - name: Generate Project Files
        shell: pwsh
        run: python scripts/Setup.py

      - name: Verify Vendor Patches Applied
        shell: pwsh
        run: python scripts/vendor_patches.py verify --require-applied

      - name: Windows Engine + Editor Tests
        shell: pwsh
        run: scripts/RunTests.bat --release

      - name: Windows Debug Engine + Editor Tests
        shell: pwsh
        run: scripts/RunTests.bat

      - name: C# ScriptCore Tests
        shell: pwsh
        run: dotnet test Tests/Index-ScriptCore-Tests/Index-ScriptCore-Tests.csproj -c Release --nologo

      - name: Project-local Package Smoke Test
        shell: pwsh
        run: scripts/ci/project_package_smoke_test.ps1 -Configuration Release

      - name: Windows Core-only Engine Validation
        shell: pwsh
        run: scripts/ci/core_module_build.ps1

      - name: Build Release + Dist Publish Bundle
        shell: pwsh
        env:
          INDEX_SIGNING_CERTIFICATE_BASE64: ${{ secrets.INDEX_SIGNING_CERTIFICATE_BASE64 }}
          INDEX_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.INDEX_SIGNING_CERTIFICATE_PASSWORD }}
          INDEX_SIGNING_TIMESTAMP_URL: ${{ vars.INDEX_SIGNING_TIMESTAMP_URL }}
        run: |
          $certificatePath = $null
          try {
            $arguments = @('-PublishBundle')
            if ($env:GITHUB_REF_TYPE -eq 'tag') {
              $arguments += @('-ReleaseTag', $env:GITHUB_REF_NAME, '-RequireSigning')
            }
            if ($env:INDEX_SIGNING_CERTIFICATE_BASE64) {
              $certificatePath = Join-Path $env:RUNNER_TEMP 'index-code-signing.pfx'
              [IO.File]::WriteAllBytes(
                $certificatePath,
                [Convert]::FromBase64String($env:INDEX_SIGNING_CERTIFICATE_BASE64)
              )
              $arguments += @('-SigningCertificatePath', $certificatePath)
              if ($env:INDEX_SIGNING_TIMESTAMP_URL) {
                $arguments += @('-SigningTimestampUrl', $env:INDEX_SIGNING_TIMESTAMP_URL)
              }
            }
            .\scripts\BuildWindows.ps1 @arguments
          }
          finally {
            if ($certificatePath -and (Test-Path -LiteralPath $certificatePath)) {
              Remove-Item -LiteralPath $certificatePath -Force
            }
          }

      - name: Bundled SDK Package Authoring Smoke Test
        shell: pwsh
        run: scripts/ci/project_package_smoke_test.ps1 -Configuration Release -EngineRoot bin/Release-windows-x86_64/Index-Launcher/EngineSDK

      - name: Bundled SDK Dist Package Authoring Smoke Test
        shell: pwsh
        run: scripts/ci/project_package_smoke_test.ps1 -Configuration Dist -EngineRoot bin/Release-windows-x86_64/Index-Launcher/EngineSDK

      - name: Windows Runtime Smoke Test
        shell: pwsh
        run: python scripts/ci/runtime_smoke_test.py --binary bin/Release-windows-x86_64/Index-Runtime/Index-Runtime.exe

      - name: Packaged Launcher + Editor Smoke Tests
        shell: pwsh
        run: |
          $bundle = 'bin/Release-windows-x86_64/Index-Launcher'
          python scripts/ci/application_smoke_test.py --binary "$bundle/Index-Launcher.exe"
          python scripts/ci/application_smoke_test.py --binary "$bundle/Index-Editor.exe" --editor-project

      - name: Archived Launcher + Editor + Dist Runtime Smoke Tests
        shell: pwsh
        run: |
          $stageLeaf = 'Index Dist Pr{0}fung' -f [char]0x00FC
          $stage = Join-Path $env:RUNNER_TEMP $stageLeaf
          if (Test-Path -LiteralPath $stage) {
            Remove-Item -LiteralPath $stage -Recurse -Force
          }
          $archive = Join-Path 'bin/Release-windows-x86_64' '${{ steps.build_metadata.outputs.archive_name }}'
          Expand-Archive -LiteralPath $archive -DestinationPath $stage
          $launcher = Join-Path $stage 'Index-Launcher.exe'
          $editor = Join-Path $stage 'Index-Editor.exe'
          python scripts/ci/application_smoke_test.py --binary $launcher
          python scripts/ci/application_smoke_test.py --binary $editor --editor-project
          $runtime = Join-Path $stage 'EngineSDK/Runtime-Dist/Index-Runtime.exe'
          python scripts/ci/runtime_smoke_test.py --binary $runtime --require-scripting

      - name: Verify Release Checksum and Signature
        shell: pwsh
        run: |
          $archive = Join-Path 'bin/Release-windows-x86_64' '${{ steps.build_metadata.outputs.archive_name }}'
          $arguments = @('-ArchivePath', $archive, '-ChecksumPath', "$archive.sha256")
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $arguments += '-RequireSignature'
          }
          scripts/VerifyRelease.ps1 @arguments

      - name: Upload Verified Windows Bundle
        uses: actions/upload-artifact@v4
        with:
          name: Index-Editor-${{ steps.build_metadata.outputs.version }}-Windows-x64
          path: |
            bin/Release-windows-x86_64/${{ steps.build_metadata.outputs.archive_name }}
            bin/Release-windows-x86_64/${{ steps.build_metadata.outputs.archive_name }}.sha256
            bin/Release-windows-x86_64/${{ steps.build_metadata.outputs.archive_name }}.sha256.p7s
          if-no-files-found: error

      - name: Upload Private Windows Symbols
        uses: actions/upload-artifact@v4
        with:
          name: Index-Private-Symbols-${{ steps.build_metadata.outputs.build_id }}
          path: bin/Release-windows-x86_64/PrivateSymbols/${{ steps.build_metadata.outputs.symbols_archive_name }}
          if-no-files-found: error
          retention-days: 90


  linux-build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Verify Vendor Patch Inputs
        run: python3 scripts/vendor_patches.py verify

      - name: Install Native Dependencies
        run: |
          sudo apt-get update
          # xorg-dev, libwayland-dev, libxkbcommon-dev, wayland-protocols, libdbus-1-dev,
          # libudev-dev: SDL3's X11/Wayland video, portal dialogs and gamepad hotplug
          # (scripts/sdl/SetupSDL.py, run by Setup). pkg-config: Dawn's CMake dep probing when
          # building webgpu_dawn from source. xvfb: headless runtime smoke test.
          # clang: Dawn's build is Clang-oriented and fails to compile under GCC 13.
          # lld: GNU ld is memory-hungry when linking the engine .so against
          # Dawn's large monolithic static archive; lld keeps the CI link stable.
          # libx11-xcb-dev: Dawn's X11 backend needs X11/Xlib-xcb.h (not in xorg-dev).
          sudo apt-get install -y xorg-dev libglu1-mesa-dev xvfb pkg-config clang lld libx11-xcb-dev lcov \
            libwayland-dev libxkbcommon-dev wayland-protocols libdbus-1-dev libudev-dev

      - name: Install Premake
        run: |
          # vendor/bin/ only contains premake5.exe (Windows) in the repo.
          # Fetch the matching Linux binary so Setup.sh can find it via the
          # vendored path the same way the Windows job does.
          PREMAKE_VERSION="5.0.0-beta5"
          URL="https://github.com/premake/premake-core/releases/download/v${PREMAKE_VERSION}/premake-${PREMAKE_VERSION}-linux.tar.gz"
          mkdir -p vendor/bin
          curl -fsSL "$URL" | tar -xz -C vendor/bin premake5
          chmod +x vendor/bin/premake5
          vendor/bin/premake5 --version

      # See the windows-build job for why CI builds Dawn. On Linux SetupDawn.sh
      # is single-config: the shared lib lands at .../native/libwebgpu_dawn.so
      # (no Release/ subfolder). Keeping Dawn shared avoids pulling its large
      # monolithic archive into libIndex-Engine.so during the CI link.
      - name: Restore Dawn cache
        id: cache-dawn
        uses: actions/cache/restore@v4
        with:
          path: |
            External/dawn/include
            External/dawn/build/gen/include
            External/dawn/build/src/dawn/native/libwebgpu_dawn.so
            External/dawn/LICENSE
            External/dawn/third_party/**/LICENSE*
            External/dawn/third_party/**/NOTICE*
            External/dawn/third_party/**/COPYING*
          key: dawn-v3-${{ runner.os }}-${{ hashFiles('scripts/dawn/dawn-revision.txt', 'scripts/dawn/SetupDawn.sh', 'scripts/dawn/patches/**') }}

      - name: Build Dawn (cache miss only)
        if: steps.cache-dawn.outputs.cache-hit != 'true'
        run: |
          chmod +x scripts/dawn/SetupDawn.sh
          ./scripts/dawn/SetupDawn.sh

      - name: Save Dawn cache
        if: steps.cache-dawn.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            External/dawn/include
            External/dawn/build/gen/include
            External/dawn/build/src/dawn/native/libwebgpu_dawn.so
            External/dawn/LICENSE
            External/dawn/third_party/**/LICENSE*
            External/dawn/third_party/**/NOTICE*
            External/dawn/third_party/**/COPYING*
          key: ${{ steps.cache-dawn.outputs.cache-primary-key }}

      - name: Generate Makefiles
        run: |
          chmod +x scripts/Setup.sh
          chmod +x vendor/bin/premake5 || true
          ./scripts/Setup.sh

      - name: Verify Vendor Patches Applied
        run: python3 scripts/vendor_patches.py verify --require-applied

      # Index-Managed builds Index-ScriptCore, the hot-reload compiler and the package tool with dotnet;
      # the Launcher's postbuild bundles everything into EngineSDK (scripts/CopyEngineSdk.py).
      - name: Build Linux Targets
        run: |
          make config=dist verbose=1 LDFLAGS="-fuse-ld=lld" -j"$(nproc)" Index-Runtime
          make config=release verbose=1 LDFLAGS="-fuse-ld=lld" -j"$(nproc)" Index-Engine Index-Managed Index-Runtime Index-Editor Index-CLI Index-Launcher

      - name: Package Linux Bundle
        run: python3 scripts/PackagePosix.py --configuration Release --output-dir dist-posix

      - name: Upload Linux Bundle
        uses: actions/upload-artifact@v4
        with:
          name: Index-Editor-Linux-x64
          path: dist-posix/*.tar.gz
          if-no-files-found: error

      - name: Linux Engine + Editor Tests
        run: |
          make config=release verbose=1 LDFLAGS="-fuse-ld=lld" -j"$(nproc)" Index-Engine-Tests Index-Editor-Tests
          ./bin/Release-linux-x86_64/Index-Engine-Tests/Index-Engine-Tests
          ./bin/Release-linux-x86_64/Index-Editor-Tests/Index-Editor-Tests

      - name: Build Linux Debug Targets
        run: make config=debug verbose=1 LDFLAGS="-fuse-ld=lld" -j"$(nproc)" Index-Engine Index-Runtime Index-Editor

      - name: Linux Runtime Smoke Test
        run: python3 scripts/ci/runtime_smoke_test.py --binary bin/Release-linux-x86_64/Index-Runtime/Index-Runtime

      - name: Linux Debug Runtime Smoke Test
        run: python3 scripts/ci/runtime_smoke_test.py --binary bin/Debug-linux-x86_64/Index-Runtime/Index-Runtime

      - name: Linux Debug Engine + Editor Tests
        run: |
          make config=debug verbose=1 LDFLAGS="-fuse-ld=lld" -j"$(nproc)" Index-Engine-Tests Index-Editor-Tests
          ./bin/Debug-linux-x86_64/Index-Engine-Tests/Index-Engine-Tests
          ./bin/Debug-linux-x86_64/Index-Editor-Tests/Index-Editor-Tests

      - name: Linux ASan + UBSan Engine Tests
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1:strict_string_checks=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          vendor/bin/premake5 --sanitize --no-profiler gmake2
          make config=debug verbose=1 LDFLAGS="-fsanitize=address,undefined -fno-sanitize-recover=all -fuse-ld=lld" -j"$(nproc)" Index-Engine-Tests
          ./bin/Debug-linux-x86_64-sanitized/Index-Engine-Tests/Index-Engine-Tests

      - name: Linux Debug Engine Coverage
        run: |
          vendor/bin/premake5 --coverage --no-profiler gmake2
          make config=debug verbose=1 LDFLAGS="--coverage -fuse-ld=lld" -j"$(nproc)" Index-Engine-Tests
          ./bin/Debug-linux-x86_64-coverage/Index-Engine-Tests/Index-Engine-Tests
          lcov --capture --directory bin-int/Debug-linux-x86_64-coverage --output-file coverage-raw.info --ignore-errors mismatch
          lcov --remove coverage-raw.info '*/External/*' '*/vendor/*' '*/Tests/*' '/usr/*' --output-file coverage.info --ignore-errors unused
          genhtml coverage.info --output-directory coverage-html

      - name: Upload Linux Debug Coverage
        uses: actions/upload-artifact@v4
        with:
          name: Index-Linux-Debug-Coverage
          path: |
            coverage.info
            coverage-html
          if-no-files-found: error

      - name: Linux Core-only Engine Validation
        run: |
          vendor/bin/premake5 --core-validation --module-profile=core gmake2
          make -C premake/generated/core config=release verbose=1 LDFLAGS="-fuse-ld=lld" -j"$(nproc)" Index-Engine

  macos-build:
    # Apple Silicon. Builds the engine, editor, launcher and CLI natively (Dawn on Metal) and runs the
    # doctest suites; the bundle is uploaded for manual checks until macOS releases are signed and notarized.
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Verify Vendor Patch Inputs
        run: python3 scripts/vendor_patches.py verify

      - name: Install Premake
        run: |
          PREMAKE_VERSION="5.0.0-beta5"
          URL="https://github.com/premake/premake-core/releases/download/v${PREMAKE_VERSION}/premake-${PREMAKE_VERSION}-macosx.tar.gz"
          mkdir -p vendor/bin
          curl -fsSL "$URL" | tar -xz -C vendor/bin premake5
          chmod +x vendor/bin/premake5
          vendor/bin/premake5 --version

      - name: Restore Dawn cache
        id: cache-dawn
        uses: actions/cache/restore@v4
        with:
          path: |
            External/dawn/include
            External/dawn/build/gen/include
            External/dawn/build/src/dawn/native/libwebgpu_dawn.dylib
            External/dawn/LICENSE
            External/dawn/third_party/**/LICENSE*
            External/dawn/third_party/**/NOTICE*
            External/dawn/third_party/**/COPYING*
          key: dawn-v3-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/dawn/dawn-revision.txt', 'scripts/dawn/SetupDawn.sh', 'scripts/dawn/patches/**') }}

      - name: Build Dawn (cache miss only)
        if: steps.cache-dawn.outputs.cache-hit != 'true'
        run: |
          chmod +x scripts/dawn/SetupDawn.sh
          ./scripts/dawn/SetupDawn.sh

      - name: Save Dawn cache
        if: steps.cache-dawn.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            External/dawn/include
            External/dawn/build/gen/include
            External/dawn/build/src/dawn/native/libwebgpu_dawn.dylib
            External/dawn/LICENSE
            External/dawn/third_party/**/LICENSE*
            External/dawn/third_party/**/NOTICE*
            External/dawn/third_party/**/COPYING*
          key: ${{ steps.cache-dawn.outputs.cache-primary-key }}

      - name: Generate Makefiles
        run: |
          chmod +x scripts/Setup.sh
          ./scripts/Setup.sh

      - name: Verify Vendor Patches Applied
        run: python3 scripts/vendor_patches.py verify --require-applied

      - name: Build macOS Targets
        run: |
          make config=dist verbose=1 -j"$(sysctl -n hw.ncpu)" Index-Runtime
          make config=release verbose=1 -j"$(sysctl -n hw.ncpu)" Index-Engine Index-Managed Index-Runtime Index-Editor Index-CLI Index-Launcher

      - name: macOS Engine + Editor Tests
        run: |
          make config=release verbose=1 -j"$(sysctl -n hw.ncpu)" Index-Engine-Tests Index-Editor-Tests
          ./bin/Release-macosx-arm64/Index-Engine-Tests/Index-Engine-Tests
          ./bin/Release-macosx-arm64/Index-Editor-Tests/Index-Editor-Tests

      - name: Package macOS Bundle
        run: python3 scripts/PackagePosix.py --configuration Release --output-dir dist-posix

      - name: Upload macOS Bundle
        uses: actions/upload-artifact@v4
        with:
          name: Index-Editor-macOS-arm64
          path: dist-posix/*.tar.gz
          if-no-files-found: error

  # Tags only: turn the verified, signed bundle into a DRAFT GitHub Release. Review and publish it by hand
  # after the clean-machine checks in Building-and-Shipping.md.
  publish-release:
    if: github.ref_type == 'tag'
    needs: [windows-build, linux-build, macos-build]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Verified Windows Bundle
        uses: actions/download-artifact@v4
        with:
          name: Index-Editor-${{ needs.windows-build.outputs.version }}-Windows-x64
          path: release

      - name: Download Linux Bundle
        uses: actions/download-artifact@v4
        with:
          name: Index-Editor-Linux-x64
          path: release

      - name: Download macOS Bundle
        uses: actions/download-artifact@v4
        with:
          name: Index-Editor-macOS-arm64
          path: release

      - name: Create Draft Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.windows-build.outputs.version }}
        run: |
          awk -v heading="## [$VERSION]" 'index($0, heading) == 1 { found = 1; next } /^## \[/ { found = 0 } found' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "CHANGELOG.md has no notes for $VERSION" >&2
            exit 1
          fi
          flags=(--draft --verify-tag --title "Index $VERSION" --notes-file release-notes.md)
          if [[ "$VERSION" == *-* ]]; then
            flags+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" release/* "${flags[@]}"
